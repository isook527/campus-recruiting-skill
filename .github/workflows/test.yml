name: Test

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Check source dates
        run: python3 scripts/check_sources.py
      - name: Generate the example application
        run: python3 scripts/prepare_application.py examples/application.json --as-of 2026-11-09T16:00:00+08:00 --job synthetic-general-beijing-2027
      - name: Validate evaluation JSON
        run: >-
          python3 -c 'import json; from pathlib import Path;
          [json.loads(path.read_text(encoding="utf-8")) for path in Path("evals").rglob("*.json")]'
